[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnis-mock"
version = "0.1.0"
description = "Mock serwera Ex Libris Primo/OMNIS — konto demo bez dostępu do prawdziwej biblioteki (m.in. konto testowe do recenzji Google Play dla omnis-mobile)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "TheUndefined" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "omnis-py>=0.2.10",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnis_mock"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly — patrz uzasadnienie w omnis-py/pyproject.toml (siostrzany projekt w tym
# samym workspace), ten sam powód dotyczy tutaj.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

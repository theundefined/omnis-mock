# Render Blueprint. Szkielet do dopracowania w docs/PLAN.md Faza 4 (rola `devops`) — wartości poniżej to
# bezpieczne (nie-sekretne) domyślne dla konta demo, nie prawdziwe poświadczenia.
services:
  - type: web
    name: omnis-mock
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        value: demo1234 # nie-sekret (patrz nagłówek pliku) — Render nie pozwala łączyć `value` z `sync: false`
    autoDeploy: true
